    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 80% at 50% 108%, #1b2846 0%, transparent 62%),
          linear-gradient(180deg, #04060d 0%, #0c1322 100%);
        transition: opacity 0.45s ease;
      }
      #boot img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 0.5);
        animation: boot-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: none; }
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #boot img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot"><img src="/apple-touch-icon-180x180.png" alt="" /></div>
